version: '3.8'

services:
  api:
    build: .
    container_name: neuralvault-api
    ports:
      - "8042:8042"
    volumes:
      - ./indexes:/app/indexes
      - ./.neuralvault:/root/.neuralvault
    environment:
      - NEURALVAULT_OFFLINE=0
    command: uvicorn neuralvault.api.app:app --host 0.0.0.0 --port 8042

  mcp:
    build: .
    container_name: neuralvault-mcp
    ports:
      - "8043:8042"
    volumes:
      - ./indexes:/app/indexes
      - ./.neuralvault:/root/.neuralvault
    environment:
      - NEURALVAULT_OFFLINE=0
    command: neuralvault mcp --transport http --port 8042
