[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralvault"
version = "0.1.0"
description = "Offline-first, measurable retrieval library for AI applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "NeuralVault Developers" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.2.0"]
vec = ["sqlite-vec>=0.1.0"]
gguf = ["llama-cpp-python>=0.2.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
mcp = ["mcp>=1.0.0"]
eval = ["pandas>=2.0.0"]
pdf = ["pymupdf>=1.23.0", "docx2txt>=0.8"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "fastembed>=0.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "mcp>=1.0.0",
    "pymupdf>=1.23.0",
    "docx2txt>=0.8",
]

[project.scripts]
neuralvault = "neuralvault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralvault"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
